name: Agent development checks
on:
  push:
    branches: [url-upgrade-v0.30.01]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Test and build
        run: |
          go test -mod=readonly -race -count=1 ./...
          go vet -mod=readonly ./...
          go build -mod=readonly ./cmd/agent ./cmd/supervisor
          go run -mod=readonly ./cmd/agent --version
      - name: Stage native Linux release files
        env:
          GOTOOLCHAIN: local
        run: |
          set -eu
          arch=$(go env GOARCH)
          mkdir -p dist
          go build -mod=readonly -trimpath -ldflags="-s -w -X main.version=v0.30.01" -o dist/nezha-agent ./cmd/agent
          go build -mod=readonly -trimpath -ldflags="-s -w" -o dist/nezha-supervisor ./cmd/supervisor
          test "$(dist/nezha-agent --version)" = v0.30.01
          cp deploy/nezha-supervisor.service docs/linux-deployment.md LICENSE dist/
          printf 'Agent=%s\nPlatform=linux/%s\nGo=%s\n' "$GITHUB_SHA" "$arch" "$(go version)" > dist/SOURCES.txt
          (cd dist && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS)
          tar -C dist -czf "nezha-agent-v0.30.01-linux-$arch.tar.gz" .
          cp dist/nezha-agent nezha-agent-linux-amd64
          cp dist/nezha-supervisor nezha-supervisor-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: agent-release-linux-amd64
          path: |
            nezha-agent-v0.30.01-linux-amd64.tar.gz
            nezha-agent-linux-amd64
            nezha-supervisor-linux-amd64
          if-no-files-found: error

  security-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Resolve and inspect exact dependency lock
        run: |
          go mod verify
          go mod tidy -diff
      - name: Readonly tests and vet
        run: |
          go test -mod=readonly -count=1 ./...
          go vet -mod=readonly ./...
      - name: Reachable Go vulnerability scan
        run: go run -mod=readonly golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Require committed dependency lock
        if: always()
        run: git diff --exit-code -- go.mod go.sum

  release:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/url-upgrade-v0.30.01' && github.event.head_commit.message == 'release: qualify and publish Agent v0.30.01'
    needs: [baseline, security-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: agent-release-linux-amd64
          path: release-dist
      - name: Publish first independent monitoring Agent release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          for arch in amd64; do
            archive="release-dist/nezha-agent-v0.30.01-linux-$arch.tar.gz"
            test -s "$archive"
            temp=$(mktemp -d)
            tar -xzf "$archive" -C "$temp"
            (cd "$temp" && sha256sum -c SHA256SUMS)
            grep -Fx "Agent=$GITHUB_SHA" "$temp/SOURCES.txt"
            grep -Fx "Platform=linux/$arch" "$temp/SOURCES.txt"
            if [ "$arch" = amd64 ]; then
              test "$("$temp/nezha-agent" --version)" = v0.30.01
            fi
            rm -rf "$temp"
          done
          chmod +x release-dist/nezha-agent-linux-amd64
          test "$(release-dist/nezha-agent-linux-amd64 --version)" = v0.30.01
          (cd release-dist && sha256sum *.tar.gz nezha-agent-linux-amd64 nezha-supervisor-linux-amd64 > SHA256SUMS)
          if gh release view v0.30.01 >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create v0.30.01 release-dist/*.tar.gz release-dist/nezha-agent-linux-amd64 release-dist/nezha-supervisor-linux-amd64 release-dist/SHA256SUMS --target "$GITHUB_SHA" --title "Nezha Agent v0.30.01" --notes-file RELEASE_V03001.md --latest
