name: Agent development checks
on:
  push:
    branches: [single-agent-v0.30.03]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Test and build
        run: |
          go test -mod=readonly -race -count=1 ./...
          go vet -mod=readonly ./...
          go build -mod=readonly ./cmd/agent
          go run -mod=readonly ./cmd/agent --version
      - name: Stage native Linux release files
        env:
          GOTOOLCHAIN: local
        run: |
          set -eu
          test "$(go env GOARCH)" = amd64
          mkdir -p dist
          go build -mod=readonly -trimpath -ldflags="-s -w -X main.version=v0.30.03" -o dist/nezha-agent ./cmd/agent
          test "$(dist/nezha-agent --version)" = v0.30.03
          (cd dist && sha256sum nezha-agent > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: agent-release-linux-amd64
          path: dist/
          if-no-files-found: error

  security-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Resolve and inspect exact dependency lock
        run: |
          go mod verify
          go mod tidy -diff
      - name: Readonly tests and vet
        run: |
          go test -mod=readonly -count=1 ./...
          go vet -mod=readonly ./...
      - name: Reachable Go vulnerability scan
        run: go run -mod=readonly golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Require committed dependency lock
        if: always()
        run: git diff --exit-code -- go.mod go.sum

  release:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/single-agent-v0.30.03' && github.event.head_commit.message == 'release: qualify and publish Agent v0.30.03'
    needs: [baseline, security-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: agent-release-linux-amd64
          path: release-dist
      - name: Publish network accounting Agent release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          chmod +x release-dist/nezha-agent
          test "$(release-dist/nezha-agent --version)" = v0.30.03
          (cd release-dist && sha256sum -c SHA256SUMS)
          if gh release view v0.30.03 >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create v0.30.03 release-dist/nezha-agent release-dist/SHA256SUMS --target "$GITHUB_SHA" --title "Nezha Agent v0.30.03" --notes-file RELEASE_V03003.md --latest
