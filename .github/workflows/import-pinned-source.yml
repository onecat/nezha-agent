name: Import pinned Agent source
on:
  push:
    branches: [managed-upgrade-v0.30.00]
    paths: ['.github/workflows/import-pinned-source.yml']
permissions:
  contents: write
concurrency:
  group: pinned-agent-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: managed-upgrade-v0.30.00
          fetch-depth: 1
      - name: Import source only, never execute it
        shell: bash
        env:
          UPSTREAM_SHA: 93936422dc010aaaf82428c775139b4953b4c9aa
        run: |
          set -euo pipefail
          if test -e go.mod || test -e docs/upstream-source.txt; then
            echo "Already imported or repository contains source; refusing overwrite."
            exit 1
          fi
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git init -q "$work/upstream"
          git -C "$work/upstream" fetch --no-tags --depth=1 https://github.com/nezhahq/agent.git "$UPSTREAM_SHA"
          test "$(git -C "$work/upstream" rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          mkdir "$work/snapshot"
          git -C "$work/upstream" archive FETCH_HEAD | tar -xf - -C "$work/snapshot"
          test -f "$work/snapshot/LICENSE"
          grep -q 'Copyright (C) 2020 naiba' "$work/snapshot/LICENSE"
          grep -q 'DO WHAT THE FUCK YOU WANT TO PUBLIC LICENSE' "$work/snapshot/LICENSE"
          # Only copy source, tests, dependency metadata, and license. Never copy
          # upstream CI, release synchronization, or publication configuration.
          for path in cmd model pkg proto go.mod go.sum LICENSE .gitignore; do
            test -e "$work/snapshot/$path"
            test ! -e "$path"
            cp -a "$work/snapshot/$path" "$path"
          done
          cp "$work/snapshot/README.md" docs/upstream-readme.md
          cp "$work/snapshot/SECURITY.md" docs/upstream-security.md
          printf 'Repository: https://github.com/nezhahq/agent\nCommit: %s\n' "$UPSTREAM_SHA" > docs/upstream-source.txt
          git add -- cmd model pkg proto go.mod go.sum LICENSE .gitignore docs/upstream-readme.md docs/upstream-security.md docs/upstream-source.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Import pinned upstream Agent source"
          git push origin HEAD:refs/heads/managed-upgrade-v0.30.00
