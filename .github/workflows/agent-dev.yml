name: Agent development checks
on:
  push:
    branches: [managed-upgrade-v0.30.00]
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Test and build
        run: |
          go test -mod=mod -race -count=1 ./...
          go vet -mod=mod ./...
          go build -mod=mod ./cmd/agent ./cmd/supervisor
          go run -mod=mod ./cmd/agent --version
      - name: Cross-compile Linux arm64
        if: runner.os == 'Linux' && runner.arch == 'X64'
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build -mod=mod -o agent-arm64 ./cmd/agent
          go build -mod=mod -o supervisor-arm64 ./cmd/supervisor

  security-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Resolve and inspect exact dependency lock
        run: |
          go mod tidy
          go mod verify
          git diff -- go.mod go.sum
      - name: Readonly tests and vet
        run: |
          go test -mod=readonly -count=1 ./...
          go vet -mod=readonly ./...
      - name: Reachable Go vulnerability scan
        run: go run -mod=readonly golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Require committed dependency lock
        if: always()
        run: git diff --exit-code -- go.mod go.sum
